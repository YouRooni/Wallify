<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3 Shapes Touch &amp; Swipe</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { width: 100vw; height: 100vh; background: #000; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
    (function () {
        'use strict';

        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d', { alpha: false });

        var MAX_DPR = 1.5;
        var viewW = 0, viewH = 0, scale = 1;

        var xOffsetShift = 0;
        var xOffsetTarget = 0;

        var isLocked = false;
        var isPaused = false;
        var isScreenOff = false;
        var animFrameId = null;

        var themeColors = { bg: '#141218', surface: '#211F26', primary: '#6750A4' };
        var hasNativeRoundRect = typeof ctx.roundRect === 'function';

        function resizeCanvas() {
            viewW = window.innerWidth || 1080;
            viewH = window.innerHeight || 2400;
            scale = Math.min(window.devicePixelRatio || 1, MAX_DPR);
            canvas.width = Math.floor(viewW * scale);
            canvas.height = Math.floor(viewH * scale);
            ctx.setTransform(scale, 0, 0, scale, 0, 0);
        }
        window.addEventListener('resize', function () {
            resizeCanvas();
            for (var i = 0; i < shapes.length; i++) {
                if (shapes[i].y > viewH - shapes[i].radius) shapes[i].y = viewH - shapes[i].radius;
                if (shapes[i].baseX > viewW + shapes[i].radius) shapes[i].baseX = viewW - shapes[i].radius;
            }
        });

        function makeShape(id, type, radius) {
            return {
                id: id,
                type: type,
                radius: radius,
                baseX: Math.random() * Math.max(1, (window.innerWidth || 1080) - radius * 2) + radius,
                y: Math.random() * Math.max(1, (window.innerHeight || 2400) - radius * 2) + radius,
                vx: (Math.random() - 0.5) * 1.0,
                vy: (Math.random() - 0.5) * 1.0
            };
        }

        var shapes = [
            makeShape(1, 'circle', 65),
            makeShape(2, 'squircle', 60),
            makeShape(3, 'circle', 55),
            makeShape(4, 'squircle', 70)
        ];

        var touchPos = { x: 0, y: 0 };
        var hasTouch = false;

        function onTouch(e) {
            if (e.touches && e.touches.length > 0) {
                touchPos.x = e.touches[0].clientX;
                touchPos.y = e.touches[0].clientY;
                hasTouch = true;
                startLoop();
            }
        }
        function endTouch() { hasTouch = false; }

        window.addEventListener('touchstart', onTouch, { passive: true });
        window.addEventListener('touchmove', onTouch, { passive: true });
        window.addEventListener('touchend', endTouch, { passive: true });
        window.addEventListener('touchcancel', endTouch, { passive: true });

        function roundRectPath(x, y, w, h, r) {
            if (hasNativeRoundRect) { ctx.roundRect(x, y, w, h, r); return; }
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function step(dt) {
            var f = dt * 60;

            xOffsetShift += (xOffsetTarget - xOffsetShift) * (1 - Math.exp(-8 * dt));

            for (var i = 0; i < shapes.length; i++) {
                var s = shapes[i];
                s.baseX += s.vx * f;
                s.y += s.vy * f;

                var currentX = s.baseX + xOffsetShift;

                if (currentX - s.radius < -100) s.baseX = viewW + s.radius - xOffsetShift;
                if (currentX + s.radius > viewW + 100) s.baseX = -s.radius - xOffsetShift;
                if (s.y - s.radius < 0) { s.y = s.radius; s.vy = Math.abs(s.vy); }
                if (s.y + s.radius > viewH) { s.y = viewH - s.radius; s.vy = -Math.abs(s.vy); }

                if (hasTouch) {
                    var dx = currentX - touchPos.x;
                    var dy = s.y - touchPos.y;
                    var d2 = dx * dx + dy * dy;
                    if (d2 < 180 * 180 && d2 > 0) {
                        var dist = Math.sqrt(d2);
                        var force = (180 - dist) / 180;
                        s.vx += (dx / dist) * force * 1.8 * f;
                        s.vy += (dy / dist) * force * 1.8 * f;
                    }
                }

                var damp = Math.exp(-0.35 * dt);
                s.vx *= damp;
                s.vy *= damp;
            }
        }

        function drawFrame() {
            ctx.fillStyle = themeColors.bg;
            ctx.fillRect(0, 0, viewW, viewH);

            for (var i = 0; i < shapes.length; i++) {
                var s = shapes[i];
                ctx.save();
                ctx.translate(s.baseX + xOffsetShift, s.y);

                ctx.fillStyle = themeColors.surface;
                if (isLocked) {
                    ctx.strokeStyle = themeColors.primary;
                    ctx.lineWidth = 8;
                }

                ctx.beginPath();
                if (s.type === 'circle') {
                    ctx.arc(0, 0, s.radius, 0, Math.PI * 2);
                } else {
                    roundRectPath(-s.radius, -s.radius, s.radius * 2, s.radius * 2, s.radius * 0.4);
                }
                ctx.fill();
                if (isLocked) ctx.stroke();
                ctx.restore();
            }
        }

        var lastTime = 0;

        function loop(now) {
            if (isPaused || isScreenOff) { animFrameId = null; return; }

            var dt = (now - lastTime) / 1000;
            if (!(dt > 0)) dt = 1 / 60;
            if (dt > 0.05) dt = 0.05;
            lastTime = now;

            step(dt);
            drawFrame();
            animFrameId = requestAnimationFrame(loop);
        }

        function startLoop() {
            if (isPaused || isScreenOff) return;
            if (animFrameId !== null) return;
            lastTime = performance.now();
            animFrameId = requestAnimationFrame(loop);
        }

        function stopLoop() {
            if (animFrameId !== null) { cancelAnimationFrame(animFrameId); animFrameId = null; }
        }

        window.addEventListener('wallpaperOffset', function (e) {
            if (e.detail && typeof e.detail.xOffset === 'number') {
                xOffsetTarget = (e.detail.xOffset - 0.5) * -160;
                startLoop();
            }
        });

        function applyMetadata(data) {
            if (!data) return;
            if (data.accentColors) {
                themeColors.bg = data.accentColors.background || themeColors.bg;
                themeColors.surface = data.accentColors.surfaceContainer || themeColors.surface;
                themeColors.primary = data.accentColors.primary || themeColors.primary;
            }
            if (typeof data.isUnlocked === 'boolean') isLocked = !data.isUnlocked;
            startLoop();
        }

        window.addEventListener('wallpaperEngineReady', function (e) {
            applyMetadata(e.detail || (window.WallpaperEngine && window.WallpaperEngine.metadata));
        });
        window.addEventListener('wallpaperUpdate', function (e) { applyMetadata(e.detail); });
        window.addEventListener('wallpaperUnlock', function (e) { applyMetadata(e.detail); });

        window.addEventListener('wallpaperScreenOn', function () {
            isScreenOff = false;
            startLoop();
        });
        window.addEventListener('wallpaperScreenOff', function () {
            isScreenOff = true;
            hasTouch = false;
            stopLoop();
        });
        window.addEventListener('wallpaperPause', function () {
            isPaused = true;
            stopLoop();
        });
        window.addEventListener('wallpaperResume', function () {
            isPaused = false;
            startLoop();
        });

        resizeCanvas();
        drawFrame();
        startLoop();
    })();
    </script>
</body>
</html>
