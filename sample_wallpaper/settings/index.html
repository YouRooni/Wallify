<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки Material 3 Shapes</title>
    <style>
        :root {
            --accent-primary: #6750A4;
            --accent-secondary: #625B71;
            --bg-color: #141218;
            --card-bg: rgba(255, 255, 255, 0.06);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            transition: background-color 0.4s ease;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        h2 {
            color: var(--accent-primary);
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .setting-group {
            margin-bottom: 16px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px;
            border-radius: 20px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-primary);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            z-index: 999999;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .toast.hidden { opacity: 0; }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.35);
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        select:focus {
            border-color: var(--accent-primary);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 16px;
            background: var(--accent-primary);
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Настройки Material 3 Shapes</h2>

        <div class="setting-group">
            <label for="speed">Скорость движения</label>
            <select id="speed">
                <option value="slow">Медленная (Режим энергосбережения)</option>
                <option value="normal" selected>Стандартная (Плавная)</option>
                <option value="fast">Динамичная (Высокая скорость)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="shapeCount">Количество фигур на экране</label>
            <select id="shapeCount">
                <option value="4">4 фигуры (Минимализм)</option>
                <option value="6" selected>6 фигур (Стандарт)</option>
                <option value="8">8 фигур (Насыщенно)</option>
                <option value="12">12 фигур (Максимум)</option>
            </select>
        </div>

        <button id="saveBtn">Сохранить настройки</button>
    </div>

    <script>
    (function () {
        'use strict';

        var speedEl = document.getElementById('speed');
        var countEl = document.getElementById('shapeCount');
        var saveBtn = document.getElementById('saveBtn');

        var userTouched = false;
        speedEl.addEventListener('change', function () { userTouched = true; });
        countEl.addEventListener('change', function () { userTouched = true; });

        function applyMonetColors(metadata) {
            if (!metadata || !metadata.accentColors) return;
            var root = document.documentElement.style;
            root.setProperty('--accent-primary', metadata.accentColors.primary);
            root.setProperty('--accent-secondary', metadata.accentColors.secondary);
            root.setProperty('--bg-color', metadata.accentColors.background);
        }

        function loadSavedValues() {
            var engine = window.WallpaperEngine;
            if (!engine || !engine.getSetting) return;
            if (userTouched) return;

            applyMonetColors(engine.metadata || engine.getMetadata());
            speedEl.value = engine.getSetting('speed', 'normal') || 'normal';
            countEl.value = engine.getSetting('shapeCount', '6') || '6';
        }

        window.addEventListener('wallpaperUpdate', function (e) {
            applyMonetColors(e.detail);
            loadSavedValues();
        });
        window.addEventListener('wallpaperEngineReady', function (e) {
            applyMonetColors(e.detail);
            loadSavedValues();
        });

        saveBtn.addEventListener('click', function () {
            var engine = window.WallpaperEngine;
            if (!engine || !engine.saveSetting) return;
            engine.saveSetting('speed', speedEl.value);
            engine.saveSetting('shapeCount', countEl.value);
            userTouched = false;
            showToast('Настройки обоев сохранены!');
        });

        var toastEl = null;
        var toastTimer = null;
        var toastRemoveTimer = null;

        function showToast(msg) {
            if (toastTimer) clearTimeout(toastTimer);
            if (toastRemoveTimer) clearTimeout(toastRemoveTimer);

            if (!toastEl) {
                toastEl = document.createElement('div');
                toastEl.className = 'toast';
                document.body.appendChild(toastEl);
            }
            toastEl.textContent = msg;
            toastEl.classList.remove('hidden');

            toastTimer = setTimeout(function () {
                toastEl.classList.add('hidden');
                toastRemoveTimer = setTimeout(function () {
                    if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
                    toastEl = null;
                }, 300);
            }, 2000);
        }

        loadSavedValues();
    })();
    </script>
</body>
</html>
